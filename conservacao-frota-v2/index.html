<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>Conservação de Frota — Celebrar 2.0</title>
  <script src="../js/vendor/html2canvas.min.js"></script>
  <script src="../js/vendor/jspdf.umd.min.js"></script>
  <style>
    :root{--yellow:#f5c400;--ink:#191919;--gray:#6f7477;--line:#d9dcde;--soft:#f4f5f5;--danger:#b3261e;--ok:#146c43;--radius:18px}
    *{box-sizing:border-box}html{font-family:Inter,Arial,sans-serif;color:var(--ink);background:#e9ebec}body{margin:0;font-size:16px}
    button,input,textarea{font:inherit}.app{max-width:860px;margin:auto;background:#fff;min-height:100vh;box-shadow:0 0 36px #0001}
    header{background:var(--ink);color:#fff;padding:18px 18px 22px;border-bottom:5px solid var(--yellow)}
    .brand{display:flex;align-items:center;gap:14px}.brand img{width:72px;height:72px;object-fit:contain;background:#fff;border-radius:14px;padding:5px}.brand p{margin:4px 0 0;color:#d7d7d7;font-size:.84rem;text-transform:uppercase;letter-spacing:.08em}.brand h1{margin:0;font-size:clamp(1.24rem,4.5vw,1.8rem);line-height:1.15}
    main{padding:18px}.notice{border-left:5px solid var(--yellow);background:#fff9dd;padding:12px 14px;border-radius:0 12px 12px 0;margin-bottom:18px;font-size:.92rem;line-height:1.4}
    .section{border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px}.section-title{display:flex;align-items:center;gap:10px;margin:0 0 16px;font-size:1.05rem}.step{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--yellow);font-weight:800}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}label{display:block;font-weight:700;font-size:.88rem;margin-bottom:6px}.required{color:var(--danger)}input,textarea{width:100%;border:1.5px solid #b9bec1;border-radius:12px;padding:13px;background:#fff;color:#111;outline:none}input:focus,textarea:focus{border-color:#111;box-shadow:0 0 0 3px #f5c40040}input[readonly]{background:#f2f3f3;color:#555}textarea{min-height:110px;resize:vertical}
    .gps-row{display:flex;gap:8px}.gps-row input{flex:1}.icon-btn{width:auto;white-space:nowrap;border:0;border-radius:12px;background:#333;color:white;padding:0 14px;font-weight:750}.icon-btn:disabled{opacity:.6}
    .rating{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.rating input{position:absolute;opacity:0;pointer-events:none}.rating label{display:flex;align-items:center;justify-content:center;text-align:center;min-height:48px;border:1.5px solid var(--line);border-radius:12px;margin:0;padding:8px;font-size:.82rem;cursor:pointer}.rating input:checked+label{border-color:#111;background:var(--yellow);box-shadow:inset 0 0 0 1px #111}
    .photos{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.photo-card{position:relative;min-width:0}.photo-box{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;aspect-ratio:1/1;border:2px dashed #a9adaf;border-radius:14px;background:#fafafa;overflow:hidden;cursor:pointer;text-align:center;padding:8px}.photo-box.has-photo{border-style:solid;padding:0}.photo-box img{width:100%;height:100%;object-fit:cover}.photo-box strong{font-size:.82rem}.photo-box small{color:#72777a;font-size:.72rem}.photo-card input{display:none}.remove{position:absolute;right:7px;top:7px;border:0;border-radius:50%;width:30px;height:30px;background:#111d;color:white;font-size:1.2rem;display:none}.has-image .remove{display:block}.add-photo{border:1.5px solid #111;background:#fff;border-radius:12px;padding:12px 16px;font-weight:800;margin-top:12px;width:100%}
    .check{display:flex;gap:10px;align-items:flex-start;background:var(--soft);border-radius:12px;padding:12px}.check input{width:20px;height:20px;margin:1px 0 0}.check label{font-weight:500;margin:0;line-height:1.35}
    .actions{position:sticky;bottom:0;background:#fffd;padding:12px 18px calc(12px + env(safe-area-inset-bottom));backdrop-filter:blur(10px);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:13px;padding:14px 12px;font-weight:850;cursor:pointer}.primary{background:var(--yellow);color:#111}.secondary{background:#1d1d1d;color:white}.btn:disabled{opacity:.55;cursor:wait}.status{grid-column:1/-1;text-align:center;font-size:.82rem;min-height:1em;color:#555}
    .counter{font-weight:500;color:#6c7275;font-size:.8rem}.error{border-color:var(--danger)!important}.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#111;color:white;padding:12px 18px;border-radius:12px;z-index:20;box-shadow:0 8px 30px #0005;max-width:90%;text-align:center;display:none}
    #pdf-template{position:fixed;left:-10000px;top:0;width:794px;background:#fff;color:#171717;padding:34px;font-family:Arial,sans-serif}.pdf-head{display:flex;align-items:center;border-bottom:5px solid var(--yellow);padding-bottom:14px;margin-bottom:18px}.pdf-head img{width:86px}.pdf-head h2{font-size:21px;margin:0}.pdf-head p{margin:5px 0 0;color:#555}.pdf-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px 20px}.pdf-field{border-bottom:1px solid #bbb;padding:7px 0;font-size:13px}.pdf-field b{display:block;font-size:10px;color:#666;text-transform:uppercase;margin-bottom:3px}.pdf-obs{border:1px solid #ccc;padding:12px;margin-top:16px;min-height:80px;white-space:pre-wrap}.pdf-photos{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}.pdf-photo{break-inside:avoid}.pdf-photo img{width:100%;height:230px;object-fit:cover;border:1px solid #bbb;border-radius:5px}.pdf-photo p{margin:4px 0;font-size:11px;font-weight:bold}.pdf-foot{font-size:10px;color:#666;margin-top:18px;border-top:1px solid #ccc;padding-top:10px}
    @media(max-width:620px){main{padding:12px}.section{padding:14px}.grid{grid-template-columns:1fr}.full{grid-column:auto}.photos{grid-template-columns:repeat(2,1fr)}.rating{grid-template-columns:1fr 1fr}.actions{padding-left:12px;padding-right:12px}.brand img{width:62px;height:62px}}
    @media print{body>*:not(#pdf-template){display:none!important}#pdf-template{position:static!important;width:auto!important}}
  </style>
</head>
<body>
<div class="app">
  <header><div class="brand"><img src="assets/logo-ssma.png" alt="SSMA Lemar"><div><h1>Formulário de Conservação de Frota</h1><p>Celebrar 2.0 • SSMA Lemar</p></div></div></header>
  <main>
    <div class="notice">Registre as condições encontradas no momento da inspeção. As fotos devem mostrar com clareza a placa, a cabine e a parte externa do veículo.</div>
    <form id="form" novalidate>
      <section class="section">
        <h2 class="section-title"><span class="step">1</span> Identificação</h2>
        <div class="grid">
          <div><label for="observer">Observador <span class="required">*</span></label><input id="observer" autocomplete="name" required placeholder="Nome de quem realizou a inspeção"></div>
          <div><label for="driver">Motorista <span class="required">*</span></label><input id="driver" required placeholder="Nome completo do motorista"></div>
          <div><label for="plate">Placa do veículo <span class="required">*</span></label><input id="plate" required maxlength="8" placeholder="ABC1D23" style="text-transform:uppercase"></div>
          <div><label for="datetime">Data e hora</label><input id="datetime" readonly></div>
          <div class="full"><label for="location">Local da inspeção <span class="required">*</span></label><div class="gps-row"><input id="location" required placeholder="Informe o local ou use o GPS"><button class="icon-btn" id="gps" type="button">⌖ Usar GPS</button></div><input id="coordinates" type="hidden"></div>
        </div>
      </section>
      <section class="section">
        <h2 class="section-title"><span class="step">2</span> Condição encontrada</h2>
        <label>Classificação da conservação <span class="required">*</span></label>
        <div class="rating">
          <div><input type="radio" name="rating" id="adequada" value="Adequada" required><label for="adequada">Adequada</label></div>
          <div><input type="radio" name="rating" id="atencao" value="Requer atenção"><label for="atencao">Requer atenção</label></div>
          <div><input type="radio" name="rating" id="inadequada" value="Inadequada"><label for="inadequada">Inadequada</label></div>
          <div><input type="radio" name="rating" id="critica" value="Crítica"><label for="critica">Crítica</label></div>
        </div>
        <div style="margin-top:14px"><label for="notes">Observações <span class="required">*</span> <span class="counter"><span id="count">0</span>/1000</span></label><textarea id="notes" required maxlength="1000" placeholder="Descreva falta de limpeza, objetos soltos, avarias, odor, condições da cabine ou demais desvios observados."></textarea></div>
      </section>
      <section class="section">
        <h2 class="section-title"><span class="step">3</span> Evidências fotográficas</h2>
        <div class="photos" id="photos"></div>
        <button type="button" class="add-photo" id="add-photo">＋ Adicionar outra foto</button>
      </section>
      <section class="section">
        <div class="check"><input type="checkbox" id="ack" required><label for="ack">Confirmo que as informações e imagens deste registro correspondem às condições observadas no momento da inspeção.</label></div>
      </section>
    </form>
  </main>
  <div class="actions"><button class="btn secondary" id="download" type="button">Baixar PDF</button><button class="btn primary" id="share" type="button">Compartilhar PDF</button><div class="status" id="status"></div></div>
</div>
<div class="toast" id="toast"></div><article id="pdf-template" aria-hidden="true"></article>
<script>
  const state={photos:[],createdAt:new Date(),id:"CF-"+Date.now().toString(36).toUpperCase(),pendingShareFile:null};
  const $=s=>document.querySelector(s), photosEl=$("#photos"), toastEl=$("#toast");
  window.addEventListener("load",()=>document.body.dataset.pdfReady=(typeof html2canvas==="function"&&!!window.jspdf?.jsPDF)?"true":"false");
  const labels=["Foto 01 — Placa","Foto 02 — Parte interna","Foto 03 — Parte externa"];
  const pad=n=>String(n).padStart(2,"0");
  function formatDate(d){return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`}
  $("#datetime").value=formatDate(state.createdAt);
  setInterval(()=>{state.createdAt=new Date();$("#datetime").value=formatDate(state.createdAt)},60000);
  $("#plate").addEventListener("input",e=>e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,""));
  $("#notes").addEventListener("input",e=>$("#count").textContent=e.target.value.length);
  function toast(msg){toastEl.textContent=msg;toastEl.style.display="block";setTimeout(()=>toastEl.style.display="none",3200)}
  function addPhoto(label,required=false){
    const index=state.photos.length, item={label,data:"",required}; state.photos.push(item);
    const card=document.createElement("div");card.className="photo-card";card.innerHTML=`<label class="photo-box" for="photo-${index}"><span style="font-size:1.7rem">▣</span><strong>${label}${required?' <span class="required">*</span>':''}</strong><small>Toque para fotografar</small></label><input id="photo-${index}" type="file" accept="image/*" capture="environment"><button class="remove" type="button" aria-label="Remover foto">×</button>`;
    const input=card.querySelector("input"),box=card.querySelector(".photo-box");
    input.addEventListener("change",async()=>{if(!input.files[0])return;item.data=await compress(input.files[0]);box.classList.add("has-photo");box.innerHTML=`<img src="${item.data}" alt="${label}">`;card.classList.add("has-image")});
    card.querySelector(".remove").addEventListener("click",()=>{item.data="";box.classList.remove("has-photo");box.innerHTML=`<span style="font-size:1.7rem">▣</span><strong>${label}${required?' <span class="required">*</span>':''}</strong><small>Toque para fotografar</small>`;card.classList.remove("has-image");input.value=""});
    photosEl.appendChild(card);
  }
  labels.forEach(x=>addPhoto(x,true));$("#add-photo").onclick=()=>addPhoto(`Foto ${pad(state.photos.length+1)} — Adicional`);
  function compress(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onerror=reject;r.onload=()=>{const im=new Image();im.onerror=reject;im.onload=()=>{const max=1200,scale=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext("2d").drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL("image/jpeg",.68))};im.src=r.result};r.readAsDataURL(file)})}
  $("#gps").onclick=()=>{const b=$("#gps");if(!navigator.geolocation)return toast("GPS não disponível neste aparelho.");b.disabled=true;b.textContent="Localizando...";navigator.geolocation.getCurrentPosition(p=>{const lat=p.coords.latitude.toFixed(6),lon=p.coords.longitude.toFixed(6);$("#coordinates").value=`${lat}, ${lon}`;$("#location").value=`GPS: ${lat}, ${lon}`;b.disabled=false;b.textContent="✓ GPS obtido"},()=>{b.disabled=false;b.textContent="⌖ Usar GPS";toast("Não foi possível acessar o GPS. Autorize a localização ou informe o local manualmente.")},{enableHighAccuracy:true,timeout:12000,maximumAge:0})};
  function validate(){document.querySelectorAll(".error").forEach(e=>e.classList.remove("error"));const f=$("#form");if(!f.checkValidity()){f.reportValidity();return false}for(let i=0;i<3;i++){if(!state.photos[i].data){photosEl.children[i].querySelector(".photo-box").classList.add("error");toast(`Inclua a ${labels[i].toLowerCase()}.`);return false}}return true}
  function esc(v){const d=document.createElement("div");d.textContent=v||"—";return d.innerHTML}
  function buildPdf(){const rating=document.querySelector('input[name="rating"]:checked')?.value,coords=$("#coordinates").value;$("#pdf-template").innerHTML=`<div class="pdf-head"><img src="assets/logo-ssma.png"><div><h2>Formulário de Conservação de Frota — Celebrar 2.0</h2><p>Registro ${state.id} • SSMA Lemar</p></div></div><div class="pdf-grid"><div class="pdf-field"><b>Observador</b>${esc($("#observer").value)}</div><div class="pdf-field"><b>Motorista</b>${esc($("#driver").value)}</div><div class="pdf-field"><b>Placa</b>${esc($("#plate").value)}</div><div class="pdf-field"><b>Data e hora</b>${esc($("#datetime").value)}</div><div class="pdf-field"><b>Local</b>${esc($("#location").value)}</div><div class="pdf-field"><b>Classificação</b>${esc(rating)}</div></div>${coords?`<div class="pdf-field"><b>Coordenadas GPS</b>${esc(coords)} • https://maps.google.com/?q=${encodeURIComponent(coords)}</div>`:""}<div class="pdf-obs"><b>OBSERVAÇÕES</b><br><br>${esc($("#notes").value)}</div><div class="pdf-photos">${state.photos.filter(p=>p.data).map(p=>`<div class="pdf-photo"><img src="${p.data}"><p>${esc(p.label)}</p></div>`).join("")}</div><div class="pdf-foot">Declaração: as informações e imagens deste registro correspondem às condições observadas no momento da inspeção.<br>Documento gerado eletronicamente em ${formatDate(new Date())}.</div>`;return $("#pdf-template")}
  const fileName=()=>`Conservacao_${$("#plate").value}_${new Date().toISOString().slice(0,10)}.pdf`;
  async function makeBlob(){
    if(typeof html2canvas!=="function"||!window.jspdf?.jsPDF)throw new Error("Gerador de PDF não carregado");
    const node=buildPdf(),canvas=await html2canvas(node,{scale:1.15,useCORS:true,backgroundColor:"#ffffff",logging:false});
    const {jsPDF}=window.jspdf,pdf=new jsPDF({orientation:"portrait",unit:"mm",format:"a4",compress:true});
    const margin=7,pageW=210,pageH=297,imgW=pageW-margin*2,imgH=canvas.height*imgW/canvas.width,pageBody=pageH-margin*2,data=canvas.toDataURL("image/jpeg",.82);
    let y=margin,remaining=imgH;pdf.addImage(data,"JPEG",margin,y,imgW,imgH,undefined,"FAST");
    while(remaining>pageBody){remaining-=pageBody;pdf.addPage();y=margin-(imgH-remaining);pdf.addImage(data,"JPEG",margin,y,imgW,imgH,undefined,"FAST")}
    return pdf.output("blob")
  }
  function saveBlob(blob){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fileName();document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),30000)}
  async function busy(button,fn){const old=button.textContent;button.disabled=true;button.textContent="Gerando...";$("#status").textContent="Preparando o documento com as fotos…";try{await fn()}catch(e){console.error(e);const detalhe=e?.message?` Detalhe: ${e.message}`:"";toast(`Não foi possível gerar o PDF.${detalhe}`)}finally{button.disabled=false;button.textContent=old;$("#status").textContent=""}}
  $("#download").onclick=()=>{if(!validate())return;busy($("#download"),async()=>saveBlob(await makeBlob()))};
  $("#share").onclick=async()=>{
    const btn=$("#share");
    if(state.pendingShareFile){
      const file=state.pendingShareFile;
      try{
        if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({title:"Conservação de Frota — Celebrar 2.0",text:`Registro do veículo ${$("#plate").value}`,files:[file]})}
        else{saveBlob(file);toast("PDF baixado. Abra o WhatsApp e anexe o arquivo.")}
        state.pendingShareFile=null;btn.textContent="Compartilhar PDF"
      }catch(e){if(e?.name!=="AbortError"){saveBlob(file);toast("O compartilhamento foi bloqueado. O PDF foi baixado para você anexar no WhatsApp.")}}
      return
    }
    if(!validate())return;
    await busy(btn,async()=>{const blob=await makeBlob();state.pendingShareFile=new File([blob],fileName(),{type:"application/pdf"})});
    if(state.pendingShareFile){btn.textContent="Compartilhar agora";toast("PDF pronto. Toque em “Compartilhar agora”.")}
  };
</script>
</body>
</html>
